# GroveMQ example configuration.
# SECURITY: the users below are demo/test credentials used by the test suite.
# Replace every password (and review auth / ACL / TLS) before exposing this
# broker to any non-local network.
broker:
  node_id: grovemq-node
  mqtt_port: :1883
  # --- Config hot-reload (zero-downtime reconfiguration) ---
  # Send SIGHUP to the process, or POST /api/v5/reload to the admin API, to
  # re-read this file and re-apply auth / ACL / hooks WITHOUT restarting the
  # broker or dropping live connections. Listeners/ports are bound once at
  # startup and are NOT affected by reload (changing them needs a restart).
  # WebSocket gateway for MQTT-over-WebSocket (clients connect to ws://host:port/mqtt
  # with the "mqtt" subprotocol). Leave empty to keep the gateway disabled.
  # Changing this port requires a restart (config reload does not rebind listeners).
  websocket_port: ""
  grpc_port: :8081
  metrics_port: :8082
  # --- Scalability / resilience tuning (all optional; defaults shown) ---
  # mailbox_size: 100          # per-subscriber delivery mailbox capacity. A slow
  #                            # or stalled subscriber fills its mailbox; once full,
  #                            # best-effort (QoS 0) messages are dropped instead of
  #                            # stalling the router. Raise for high fan-out topics.
  # write_timeout: 0           # seconds; bounds how long a single outbound write to a
  #                            # client may block before the session fails fast (0 = off).
  # max_connections: 0         # hard cap on simultaneous live connections (0 = unlimited).
  #                            # MQTT 5.0 clients over the limit get 0x97 (Quota Exceeded);
  #                            # MQTT 3.1/3.1.1 clients are disconnected.
  auth:
    enabled: true
    # Allow clients that present no username/password. This is an explicit
    # opt-in for local development and the test suite; set it to false before
    # exposing the broker to any untrusted network.
    allow_anonymous: true
    users:
    - username: admin
      password: admin123
      algorithm: bcrypt
      enabled: true
    - username: user1
      password: password123
      algorithm: sha256
      enabled: true
    - username: test
      password: test
      algorithm: plain
      enabled: true
    - username: guest
      password: guest123
      algorithm: sha256
      enabled: false
    - username: device001
      password: device_secret_key
      algorithm: bcrypt
      enabled: true
    - username: newuser
      password: updatedsecret
      algorithm: bcrypt
      enabled: false
    - username: iot_device_123
      password: secret_key_123
      algorithm: sha256
      enabled: true

  # Authorization (ACL): who may publish/subscribe to which topics.
  # Disabled by default -> all access allowed (no behavior change). When enabled,
  # requests are evaluated against `rules` in priority order; the first matching
  # rule decides (allow/deny). If nothing matches, `default_action` applies.
  # `default_action: allow` = safe rollout; set to `deny` for strict lockdown.
  acl:
    enabled: false
    default_action: allow
    rules:
    # Example: deny anonymous clients from writing control topics.
    # - id: deny-anon-control
    #   permission: deny
    #   action: publish
    #   username: anonymous
    #   topic: control/#
    #   priority: 1
    #   enabled: true
    # Example: allow device001 to publish only under its own prefix.
    # - id: allow-device001
    #   permission: allow
    #   action: publish
    #   username: device001
    #   topic: devices/device001/#
    #   priority: 10
    #   enabled: true

  # --- Hooks (extension points) ---
  # All hooks are OPT-IN and OFF by default, so leaving this block out has zero
  # effect on broker behaviour. The hook chain is always wired into the core
  # loop; these settings only activate the built-in example hooks.
  # New custom hooks can be registered programmatically via broker.GetHooks().
  hooks:
    # Per-client publish rate limiting (token bucket). Disabled = unlimited.
    rate_limit:
      enabled: false
      publish_rate: 0   # tokens per second; 0 = unlimited
      publish_burst: 0  # bucket capacity; 0 = unlimited
    # Connection / session / message auditing via the standard logger ([AUDIT]).
    audit:
      enabled: false
      # points left empty => a sensible default set is enabled (connect/disconnect,
      # subscribe/unsubscribe, publish). Otherwise list specific points, e.g.:
      # points:
      #   - on_client_connected
      #   - on_message_publish
  # --- A2A over MQTT Registry (opt-in, startup-only) ---
  # When enabled, GroveMQ indexes retained Agent Cards published to
  # $a2a/v1/discovery/{org}/{unit}/{agent} and exposes them at
  # /api/v5/a2a/agents. The MQTT client ID must match the agent address.
  # Changing this block requires a broker restart (not a hot reload).
  a2a_registry:
    enabled: false
    validate_schema: strict       # strict (A2A 1.0) | loose (EMQX-style cards)
    max_card_size: 65536          # bytes; 0 applies the built-in default
    registration_rate_limit: 10   # card updates per agent per minute; 0 = unlimited
    binding_url: "mqtt://localhost:1883"
    require_security_metadata: false # require securitySchemes/security and a JWS signature
    allowed_jku_prefixes: []         # exact URL prefixes trusted for JWKS fetches

  # --- A2A HTTP JSON-RPC gateway (opt-in, startup-only) ---
  # Exposes POST /a2a/v1/{org}/{unit}/{agent} on the dashboard port. Standard
  # A2A SDKs using the JSON-RPC binding can call GroveMQ Agents by changing
  # only the endpoint URL. Requests are bridged to $a2a/v1/.../requests with
  # MQTT 5.0 Response Topic and Correlation Data.
  a2a_gateway:
    enabled: false
    mqtt_broker_url: ""       # empty = local mqtt_port
    username: ""              # optional MQTT client user for the bridge
    password: ""              # optional MQTT client password for the bridge
    timeout_seconds: 5        # 0 = built-in default (5s)

  # --- Load balancing (docs/design/LOAD_BALANCING.md) ---
  # All fields are optional; omitted values fall back to the same built-in
  # defaults in DefaultConfig(). The defaults introduce no new behaviour,
  # which keeps rolling upgrades safe. Every field also has an env override
  # (used by k8s/statefulset.yaml):
  #   GROVEMQ_ACCESS_LB, MQTT_ADVERTISE_ADDR, GROVEMQ_LB_SOFT_LIMIT,
  #   GROVEMQ_LB_SECRET, GROVEMQ_SHARED_ROUTE_POLICY, GROVEMQ_LB_STRATEGY
  # GROVEMQ_LB_SECRET must be identical on every node: it signs the one-hop
  # CONNACK 0x9C redirect token carried in MQTT 5.0 user properties.
  balance:
    access_lb: off                 # off | l4 | redirect | both
    mqtt_advertise_addr: ""       # client-reachable MQTT endpoint (NOT the gRPC NODE_ADVERTISE_ADDR)
    soft_limit: 0.8               # redirect when local utilisation exceeds this
    lb_strategy: round_robin      # round_robin | least_connections | consistent_hash
    shared_route_policy: fanout   # fanout (baseline) | single (cross-node $share semantics)
