# k8s/statefulset.yaml
# This StatefulSet manages the deployment and scaling of a set of grovemq pods.
# It provides guarantees about the ordering and uniqueness of these pods.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grovemq
spec:
  # The serviceName must match the name of the headless service.
  # This is crucial for providing stable network identifiers to the pods.
  serviceName: "grovemq-headless"
  # We start with 2 replicas to test clustering.
  replicas: 2
  selector:
    matchLabels:
      app: grovemq
  template:
    metadata:
      labels:
        app: grovemq
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: grovemq
        # Replace with the actual image path from your container registry.
        image: grovemq:latest
        imagePullPolicy: Never # For local testing
        ports:
        - containerPort: 1883
          name: mqtt
        - containerPort: 8081
          name: grpc
        env:
          # The POD_NAMESPACE is used by the discovery mechanism to find peers.
          # The Downward API is used to inject the pod's namespace into the env var.
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # Stable per-pod identity. The Downward API gives the StatefulSet pod
          # name, which must match the node ID used by peer discovery.
          - name: NODE_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          # Peers dial back the pod's headless-service DNS name, not localhost.
          - name: NODE_ADVERTISE_ADDR
            value: "$(NODE_ID).grovemq-headless:8081"
          # Enable durable sessions/retained state and cluster state replication.
          # Each pod gets its own PVC (bbolt takes an exclusive file lock).
          - name: GROVEMQ_DATA_DIR
            value: /data
          # --- Load balancing (docs/design/LOAD_BALANCING.md §6.2) ---
          # "l4" uses k8s/service.yaml; "redirect"/"both" additionally enable
          # the MQTT 5.0 CONNACK 0x9C handoff. MQTT_ADVERTISE_ADDR must be an
          # endpoint reachable by CLIENTS, not the internal gRPC address.
          - name: GROVEMQ_ACCESS_LB
            value: "l4"
          - name: MQTT_ADVERTISE_ADDR
            value: "grovemq-mqtt:1883"
          # Forwarding-plane policy: "fanout" is the rolling-upgrade-safe
          # baseline; "single" enables cross-node shared-group single-target.
          - name: GROVEMQ_SHARED_ROUTE_POLICY
            value: "fanout"
          - name: GROVEMQ_LB_STRATEGY
            value: "round_robin"
          # A shared HMAC secret is required when GROVEMQ_ACCESS_LB=redirect:
          # - name: GROVEMQ_LB_SECRET
          #   valueFrom:
          #     secretKeyRef: { name: grovemq-lb, key: secret }
        volumeMounts:
        - name: data
          mountPath: /data
  # A per-pod volume keeps the bbolt state stable across pod restarts.
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi