<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial Unicode MS, sans-serif">
<rect width="1600" height="1020" fill="#F6F8FC"/>
<rect x="0" y="0" width="1600" height="100" rx="8" fill="#FFFFFF"/>
<rect x="0" y="0" width="10" height="100" rx="8" fill="#6D3BD1"/>
<text x="40" y="40" font-size="25" fill="#16203A" text-anchor="start" dominant-baseline="auto" font-weight="700">图 2  两层负载均衡不是同一个问题的两个版本</text>
<text x="40" y="76" font-size="14" fill="#5B6B87" text-anchor="start" dominant-baseline="auto">同一个词「负载均衡」，在连接维度与消息维度上是两个不同的问题</text>
<line x1="40" y1="96" x2="1560" y2="96" stroke="#C9D4E3" stroke-width="1.2"/>
<rect x="40" y="130" width="1520" height="150" rx="10" fill="#F1F5F9" stroke="#C9D4E3" stroke-width="1.5"/>
<rect x="40" y="130" width="8" height="150" rx="4" fill="#46546B"/>
<text x="70" y="172" font-size="19" fill="#46546B" text-anchor="start" dominant-baseline="auto" font-weight="700">客户端 · MQTT 3.1.1 / 5.0（IoT、车联网、AI 设备）</text>
<text x="70" y="214" font-size="14.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">实体：连接 / 会话</text>
<rect x="40" y="270" width="1520" height="150" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="40" y="270" width="8" height="150" rx="4" fill="#2563EB"/>
<text x="70" y="312" font-size="19" fill="#2563EB" text-anchor="start" dominant-baseline="auto" font-weight="700">① 接入层 · 决定一条 CONNECT 落在哪个节点</text>
<text x="70" y="354" font-size="14.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">决策单位：CONNECT   |   频率：每次建连   |   状态：NodeLoadTable + 连接表   |   降级：本地接受</text>
<rect x="1330" y="288" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
<text x="1430.0" y="301" font-size="12.6" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">新建 / 改造</text>
<rect x="40" y="450" width="1520" height="150" rx="10" fill="#F4EFFE" stroke="#C9B2F2" stroke-width="1.5"/>
<rect x="40" y="450" width="8" height="150" rx="4" fill="#6D3BD1"/>
<text x="70" y="492" font-size="19" fill="#6D3BD1" text-anchor="start" dominant-baseline="auto" font-weight="700">② 转发层 · 决定一条 PUBLISH 走哪些远端节点</text>
<text x="70" y="534" font-size="14.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">决策单位：PUBLISH   |   频率：每消息   |   状态：remoteRoutes 倒排索引   |   降级：fan-out 兜底</text>
<rect x="1330" y="468" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#6D3BD1" stroke-width="1.2"/>
<text x="1430.0" y="481" font-size="12.6" fill="#6D3BD1" text-anchor="middle" dominant-baseline="middle" font-weight="700">新建 / 改造</text>
<rect x="40" y="630" width="1520" height="150" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
<rect x="40" y="630" width="8" height="150" rx="4" fill="#07835D"/>
<text x="70" y="672" font-size="19" fill="#07835D" text-anchor="start" dominant-baseline="auto" font-weight="700">订阅者 · 普通订阅（全量接收）/ 共享订阅（组内恰好一次）</text>
<text x="70" y="714" font-size="14.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">实体：订阅 / mailbox</text>
<polyline points="800,280 800,270" fill="none" stroke="#46546B" stroke-width="2.0"/>
<polygon points="800.0,270.0 804.5,280.0 795.5,280.0" fill="#46546B"/>
<polyline points="800,420 800,450" fill="none" stroke="#46546B" stroke-width="2.0"/>
<polygon points="800.0,450.0 795.5,440.0 804.5,440.0" fill="#46546B"/>
<polyline points="800,600 800,630" fill="none" stroke="#46546B" stroke-width="2.0"/>
<polygon points="800.0,630.0 795.5,620.0 804.5,620.0" fill="#46546B"/>
<text x="830" y="240" font-size="13" fill="#5B6B87" text-anchor="start" dominant-baseline="auto">CONNECT（长连接建立）</text>
<text x="830" y="437" font-size="13" fill="#5B6B87" text-anchor="start" dominant-baseline="auto">PUBLISH（进入消息面）</text>
<text x="830" y="617" font-size="13" fill="#5B6B87" text-anchor="start" dominant-baseline="auto">投递给订阅者</text>
<rect x="40" y="916" width="1520" height="64" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<rect x="40" y="916" width="7" height="64" rx="3" fill="#2563EB"/>
<text x="64" y="948.0" font-size="15.2" fill="#2563EB" text-anchor="start" dominant-baseline="middle" font-weight="700">把两层混为一谈，就会在消息热路径上做低频控制面的事（同步查负载），或在连接层追求逐消息均衡</text>
<text x="40" y="1004" font-size="12.6" fill="#5B6B87" text-anchor="start" dominant-baseline="auto">GroveMQ · 负载均衡底层机制  |  职责分界</text>
<text x="1560" y="1004" font-size="12.6" fill="#5B6B87" text-anchor="end" dominant-baseline="middle">SVG / PNG</text>
</svg>