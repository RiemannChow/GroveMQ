<text x="40" y="40" font-size="25" fill="#16203A" text-anchor="start" dominant-baseline="auto" font-weight="700">图 6  控制面与数据面的频率分离</text>
<text x="40" y="76" font-size="14" fill="#5B6B87" text-anchor="start" dominant-baseline="auto">负载 5 秒更新一次，消息每微秒决策一次 —— 两者必须解耦，用数据新鲜度换可扩展性</text>
<line x1="40" y1="96" x2="1560" y2="96" stroke="#C9D4E3" stroke-width="1.2"/>
