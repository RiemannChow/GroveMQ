<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial Unicode MS, sans-serif">
<rect width="1600" height="1020" fill="#F6F8FC"/>
<rect x="0" y="0" width="1600" height="100" rx="8" fill="#FFFFFF"/>
<rect x="0" y="0" width="10" height="100" rx="8" fill="#6D3BD1"/>
<text x="40" y="40" font-size="25" fill="#16203A" text-anchor="start" dominant-baseline="auto" font-weight="700">图 1  负载均衡的第一性原理：决策粒度</text>
<text x="40" y="76" font-size="14" fill="#5B6B87" text-anchor="start" dominant-baseline="auto">连接是长期资源，消息是瞬时事件 —— 决策发生的频率决定了整个架构</text>
<line x1="40" y1="96" x2="1560" y2="96" stroke="#C9D4E3" stroke-width="1.2"/>
<rect x="40" y="130" width="740" height="610" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="40" y="130" width="740" height="34" rx="9" fill="#2563EB"/>
<rect x="40" y="154" width="740" height="10" rx="0" fill="#2563EB"/>
<text x="54" y="147.0" font-size="16" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" font-weight="700">① 接入层 · 连接 = 长期资源</text>
<text x="54" y="186" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">一条 CONNECT 建立后，连接可能持续数小时甚至数天</text>
<text x="54" y="212" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">均衡只发生在 t0 建连瞬间，之后不再有任何调度</text>
<line x1="90" y1="330" x2="730" y2="330" stroke="#C9D4E3" stroke-width="2.0"/>
<text x="90" y="306" font-size="13" fill="#5B6B87" text-anchor="start" dominant-baseline="auto">t0  建连</text>
<text x="730" y="306" font-size="13" fill="#5B6B87" text-anchor="end" dominant-baseline="middle">t0 + 2h</text>
<circle cx="120" cy="330" r="9" fill="#2563EB"/>
<rect x="120" y="350" width="580" height="46" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.4"/>
<text x="410" y="373" font-size="14" fill="#2563EB" text-anchor="middle" dominant-baseline="middle" font-weight="700">一条长连接持续存在（期间 0 次调度）</text>
<polyline points="120,268 120,320" fill="none" stroke="#2563EB" stroke-width="2.4"/>
<polygon points="120.0,320.0 115.5,310.0 124.5,310.0" fill="#2563EB"/>
<text x="140" y="262" font-size="13.4" fill="#2563EB" text-anchor="start" dominant-baseline="auto" font-weight="700">唯一一次决策：选节点</text>
<line x1="120" y1="322" x2="120" y2="338" stroke="#C9D4E3" stroke-width="1.2"/>
<text x="120" y="414" font-size="12" fill="#5B6B87" text-anchor="middle" dominant-baseline="auto">t0</text>
<line x1="310" y1="322" x2="310" y2="338" stroke="#C9D4E3" stroke-width="1.2"/>
<text x="310" y="414" font-size="12" fill="#5B6B87" text-anchor="middle" dominant-baseline="auto">t0+30m</text>
<line x1="500" y1="322" x2="500" y2="338" stroke="#C9D4E3" stroke-width="1.2"/>
<text x="500" y="414" font-size="12" fill="#5B6B87" text-anchor="middle" dominant-baseline="auto">t0+1h</text>
<line x1="690" y1="322" x2="690" y2="338" stroke="#C9D4E3" stroke-width="1.2"/>
<text x="690" y="414" font-size="12" fill="#5B6B87" text-anchor="middle" dominant-baseline="auto">t0+2h</text>
<rect x="40" y="470" width="740" height="250" rx="9" fill="#FFFFFF" stroke="#C9D4E3" stroke-width="1.5"/>
<rect x="40" y="470" width="740" height="30" rx="9" fill="#46546B"/>
<rect x="40" y="490" width="740" height="10" rx="0" fill="#46546B"/>
<text x="54" y="485.0" font-size="14.5" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" font-weight="700">状态与推论</text>
<text x="54" y="522" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">状态位置：连接表 / NodeLoadTable（低频、可容忍 5s 级陈旧）</text>
<text x="54" y="552" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">决策次数 = 1（与消息量无关）</text>
<text x="54" y="582" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">本质：一次性「分配 / 装箱问题」，不是逐请求调度</text>
<text x="54" y="612" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">陷阱：连接数 ≠ 消息量，长连接下 least-connections 会失真</text>
<rect x="820" y="130" width="740" height="610" rx="9" fill="#F4EFFE" stroke="#C9B2F2" stroke-width="1.5"/>
<rect x="820" y="130" width="740" height="34" rx="9" fill="#6D3BD1"/>
<rect x="820" y="154" width="740" height="10" rx="0" fill="#6D3BD1"/>
<text x="834" y="147.0" font-size="16" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" font-weight="700">② 转发层 · 消息 = 瞬时事件</text>
<text x="834" y="186" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">每条 PUBLISH 都是独立事件，必须立刻决定走哪些节点</text>
<text x="834" y="212" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">决策频率 = 消息速率（可能每秒数十万次）</text>
<line x1="870" y1="330" x2="1510" y2="330" stroke="#C9D4E3" stroke-width="2.0"/>
<text x="870" y="306" font-size="13" fill="#5B6B87" text-anchor="start" dominant-baseline="auto">t0</text>
<text x="1510" y="306" font-size="13" fill="#5B6B87" text-anchor="end" dominant-baseline="middle">t0 + 1s</text>
<line x1="880" y1="322" x2="880" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="880" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="880,268 880,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="932" y1="322" x2="932" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="932" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="932,268 932,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="984" y1="322" x2="984" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="984" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="984,268 984,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="1036" y1="322" x2="1036" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="1036" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="1036,268 1036,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="1088" y1="322" x2="1088" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="1088" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="1088,268 1088,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="1140" y1="322" x2="1140" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="1140" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="1140,268 1140,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="1192" y1="322" x2="1192" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="1192" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="1192,268 1192,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="1244" y1="322" x2="1244" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="1244" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="1244,268 1244,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="1296" y1="322" x2="1296" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="1296" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="1296,268 1296,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="1348" y1="322" x2="1348" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="1348" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="1348,268 1348,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="1400" y1="322" x2="1400" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="1400" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="1400,268 1400,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<line x1="1452" y1="322" x2="1452" y2="338" stroke="#6D3BD1" stroke-width="1.6"/>
<circle cx="1452" cy="330" r="4.5" fill="#6D3BD1"/>
<polyline points="1452,268 1452,318" fill="none" stroke="#6D3BD1" stroke-width="1.6"/>
<text x="1190" y="250" font-size="14" fill="#6D3BD1" text-anchor="middle" dominant-baseline="middle" font-weight="700">每条消息各做一次决策</text>
<rect x="870" y="350" width="640" height="46" rx="8" fill="#F4EFFE" stroke="#C9B2F2" stroke-width="1.4"/>
<text x="1190" y="373" font-size="14" fill="#6D3BD1" text-anchor="middle" dominant-baseline="middle" font-weight="700">12 次 PUBLISH → 12 次独立选点</text>
<rect x="820" y="470" width="740" height="250" rx="9" fill="#FFFFFF" stroke="#C9D4E3" stroke-width="1.5"/>
<rect x="820" y="470" width="740" height="30" rx="9" fill="#46546B"/>
<rect x="820" y="490" width="740" height="10" rx="0" fill="#46546B"/>
<text x="834" y="485.0" font-size="14.5" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" font-weight="700">状态与推论</text>
<text x="834" y="522" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">状态位置：remoteRoutes 倒排索引（每节点一份本地副本）</text>
<text x="834" y="552" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">决策次数 = 消息数（热路径，P99 必须 &lt; 100µs）</text>
<text x="834" y="582" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">本质：每事件「路由问题」，纯内存、禁 RPC、禁持锁 I/O</text>
<text x="834" y="612" font-size="13.2" fill="#16203A" text-anchor="start" dominant-baseline="auto">推论：负载数据必须预取，不能临场去问别的节点</text>
<rect x="40" y="916" width="1520" height="64" rx="9" fill="#F4EFFE" stroke="#6D3BD1" stroke-width="1.6"/>
<rect x="40" y="916" width="7" height="64" rx="3" fill="#6D3BD1"/>
<text x="64" y="948.0" font-size="15.5" fill="#6D3BD1" text-anchor="start" dominant-baseline="middle" font-weight="700">接入层 = 一次性「分配问题」；转发层 = 每事件「路由问题」  ——  两者的算法、状态与降级完全不同</text>
<text x="40" y="1004" font-size="12.6" fill="#5B6B87" text-anchor="start" dominant-baseline="auto">GroveMQ · 负载均衡底层机制  |  决策粒度</text>
<text x="1560" y="1004" font-size="12.6" fill="#5B6B87" text-anchor="end" dominant-baseline="middle">SVG / PNG</text>
</svg>