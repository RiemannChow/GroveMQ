<text x="1254" y="394" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">SyncNodeStatus 心跳捎带</text>
<text x="1254" y="416" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">本节点读 ConnectionsGauge</text>
<text x="1254" y="438" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">2×heartbeat 未更新 = stale</text>
<text x="1254" y="460" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">不复用死代码 clustermon</text>
