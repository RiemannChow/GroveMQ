<text x="444" y="372" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">k8s Service type: LoadBalancer</text>
<text x="444" y="394" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">sessionAffinity: ClientIP</text>
<text x="444" y="416" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">externalTrafficPolicy: Local</text>
<text x="444" y="438" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">长连接：只分流新连接</text>
<text x="444" y="460" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">禁止 HTTP / Ingress 代理 MQTT</text>
