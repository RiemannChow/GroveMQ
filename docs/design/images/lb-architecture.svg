<text x="984" y="372" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">AdmissionController.OnConnect</text>
<text x="984" y="394" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">认证通过后才判定</text>
<text x="984" y="416" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">soft_limit 默认 0.8</text>
<text x="984" y="438" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">MQTT_ADVERTISE_ADDR（≠ gRPC）</text>
<text x="984" y="460" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">负载 stale → 禁用重定向</text>
