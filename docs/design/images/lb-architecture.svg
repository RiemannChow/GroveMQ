<text x="84" y="895.0" font-size="15.5" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" font-weight="700">匹配路由（改造）</text>
<text x="84" y="932" font-size="12.6" fill="#16203A" text-anchor="start" dominant-baseline="auto">remoteRoutes: RouteKey{Group, Filter}</text>
<text x="84" y="957" font-size="12.6" fill="#16203A" text-anchor="start" dominant-baseline="auto">ParseSharedFilter 剥离 $share/g/</text>
<text x="84" y="982" font-size="12.6" fill="#16203A" text-anchor="start" dominant-baseline="auto">SUBACK 0x9F 拒绝非法 filter</text>
<text x="84" y="1007" font-size="12.6" fill="#16203A" text-anchor="start" dominant-baseline="auto">routes:v2 双读兼容滚动升级</text>
<text x="84" y="1032" font-size="12.6" fill="#16203A" text-anchor="start" dominant-baseline="auto">修复：原样注册 $share/g/t 永不命中</text>
