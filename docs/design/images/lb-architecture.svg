<text x="1324" y="932" font-size="12.8" fill="#16203A" text-anchor="start" dominant-baseline="auto">ForwardPublish{SharedGroup=g}</text>
<text x="1324" y="959" font-size="12.8" fill="#16203A" text-anchor="start" dominant-baseline="auto">目标节点 GetSharedSubscribersForGroup</text>
<text x="1324" y="986" font-size="12.8" fill="#16203A" text-anchor="start" dominant-baseline="auto">本地 NextIndex 再选 1 个成员 → 恰好 1 次</text>
<text x="1324" y="1013" font-size="12.8" fill="#16203A" text-anchor="start" dominant-baseline="auto">验收：3 节点发布 100 条 → 100 次投递</text>
