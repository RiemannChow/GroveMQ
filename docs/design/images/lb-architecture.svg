<text x="874" y="895.0" font-size="15.5" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle" font-weight="700">普通订阅 · 保持 fan-out</text>
<text x="874" y="932" font-size="12.8" fill="#16203A" text-anchor="start" dominant-baseline="auto">语义要求：所有匹配订阅者都收到</text>
<text x="874" y="959" font-size="12.8" fill="#16203A" text-anchor="start" dominant-baseline="auto">目标 = 全部匹配节点</text>
<text x="874" y="986" font-size="12.8" fill="#16203A" text-anchor="start" dominant-baseline="auto">行为与基线一致，不能做均衡</text>
<text x="874" y="1013" font-size="12.8" fill="#16203A" text-anchor="start" dominant-baseline="auto">回归验收：3 节点 → 3 次投递</text>
<rect x="1310" y="880" width="420" height="168" rx="9" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
