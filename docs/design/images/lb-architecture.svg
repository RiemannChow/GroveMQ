<text x="82" y="1122" font-size="12.7" fill="#16203A" text-anchor="start" dominant-baseline="auto">① 修复跨节点 $share 是 P0 bug，不是增强；可独立先发（commit #1）</text>
<text x="82" y="1150" font-size="12.7" fill="#16203A" text-anchor="start" dominant-baseline="auto">② 转发层选点不得持 Manager.mu 做网络 I/O；Snapshot() 返回只读副本</text>
<text x="82" y="1178" font-size="12.7" fill="#16203A" text-anchor="start" dominant-baseline="auto">③ 宁可重复不可丢失：选点失败一律退回 fan-out，并打点 lb_stale_fallback_total</text>
