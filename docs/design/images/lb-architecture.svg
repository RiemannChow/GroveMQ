<text x="474" y="932" font-size="12.6" fill="#16203A" text-anchor="start" dominant-baseline="auto">RoundRobin（按 group 分桶，粘性）</text>
<text x="474" y="957" font-size="12.6" fill="#16203A" text-anchor="start" dominant-baseline="auto">LeastConnections（NodeLoadTable）</text>
<text x="474" y="982" font-size="12.6" fill="#16203A" text-anchor="start" dominant-baseline="auto">ConsistentHash（组级粘性）</text>
<text x="474" y="1007" font-size="12.6" fill="#16203A" text-anchor="start" dominant-baseline="auto">平局按 nodeID 字典序，确定性</text>
<text x="474" y="1032" font-size="12.6" fill="#16203A" text-anchor="start" dominant-baseline="auto">失败 / stale → fan-out 兜底</text>
<rect x="860" y="880" width="420" height="168" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
