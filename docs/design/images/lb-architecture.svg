<text x="714" y="372" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">CONNACK 0x9C Use another server</text>
<text x="714" y="394" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">Properties.ServerReference</text>
<text x="714" y="416" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">mochi 已支持，无需写 codec</text>
<text x="714" y="438" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">单跳 + HMAC token + cooldown</text>
<text x="714" y="460" font-size="12.4" fill="#16203A" text-anchor="start" dominant-baseline="auto">3.1.1 不支持 → 本地接受</text>
