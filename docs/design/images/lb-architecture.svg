<text x="922" y="1122" font-size="12.7" fill="#16203A" text-anchor="start" dominant-baseline="auto">· topic 分片 / 一致性哈希分区（docs/phase-3/RISK.md:51）</text>
<text x="922" y="1150" font-size="12.7" fill="#16203A" text-anchor="start" dominant-baseline="auto">· 跨节点 QoS 1/2 可靠性（PublishForward 缺 MessageId/Retain/Dup）</text>
